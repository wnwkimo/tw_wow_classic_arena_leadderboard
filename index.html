<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台服經典版競技場天梯</title>
  <meta name="description" content="台服魔獸世界經典版競技場歷史天梯：各賽季 2v2、3v3、5v5、積分戰場排名。">
  <meta name="theme-color" content="#0b0e14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">TW WoW Classic · Arena Ladder</p>
      <h1 class="site-title">台服經典版競技場天梯</h1>
      <p class="site-sub">by Yesican-ivus · 榮耀來自於夥伴</p>
    </div>
  </header>

  <div class="controls">
    <div class="wrap controls-inner">
      <label class="select season-select">
        <span class="visually-hidden">賽季</span>
        <select id="seasonSelect" aria-label="賽季"></select>
      </label>
      <div class="tabs" id="bracketTabs" role="tablist" aria-label="賽制"></div>
    </div>
  </div>

  <main class="wrap">
    <section class="board-head">
      <div>
        <h2 id="boardHeading" class="board-title">載入中…</h2>
        <p id="seasonStatus" class="board-status"></p>
      </div>
    </section>

    <section class="stats" id="stats" aria-label="賽制統計"></section>

    <section class="card titles" id="titles" aria-label="頭銜門檻" hidden></section>

    <section class="podium" id="podium" aria-label="前三名"></section>

    <section class="board" id="board" aria-label="排行榜">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜尋角色、隊伍、成員或伺服器" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="filters">
          <label class="select select-sm">
            <span class="visually-hidden">陣營</span>
            <select id="factionFilter" aria-label="陣營">
              <option value="">全部陣營</option>
              <option value="HORDE">部落</option>
              <option value="ALLIANCE">聯盟</option>
            </select>
          </label>
          <label class="select select-sm">
            <span class="visually-hidden">職業</span>
            <select id="classFilter" aria-label="職業"><option value="">全部職業</option></select>
          </label>
          <label class="select select-sm">
            <span class="visually-hidden">排序</span>
            <select id="sortSelect" aria-label="排序">
              <option value="rank">依排名</option>
              <option value="winrate">依勝率</option>
              <option value="played">依場次</option>
              <option value="won">依勝場</option>
            </select>
          </label>
        </div>
      </div>

      <p class="result-count" id="resultCount" aria-live="polite"></p>

      <div class="list-head" id="listHead" aria-hidden="true">
        <span>排名</span><span>角色 / 隊伍</span><span>分數</span><span>勝-敗</span><span>勝率</span>
      </div>
      <ol class="list" id="leaderboard"></ol>
      <div class="message" id="message" hidden></div>
      <button type="button" class="btn btn-more" id="loadMore" hidden>顯示更多</button>
    </section>

    <section class="charts" aria-label="分佈圖">
      <article class="card">
        <h3 class="card-title">職業分佈</h3>
        <p class="card-sub">本賽制所有上榜角色（隊伍則計算成員）</p>
        <div id="classChart"></div>
      </article>
      <article class="card">
        <h3 class="card-title">分數分佈</h3>
        <p class="card-sub">每一格的上榜筆數，點選或滑過查看</p>
        <div id="ratingChart"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>資料來源：Blizzard 官方 API。本站與 Blizzard Entertainment 無關。</p>
      <label class="btn btn-ghost">
        開啟本機 JSON
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </label>
    </div>
  </footer>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
